[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         tail
    # Replace this with the actual path to your application's log file
    Path         /path/to/your/travel_app.log
    Tag          travel_app
    # Ensure Fluent Bit starts from the end of the file, not the beginning, to avoid spam
    Read_from_Head False

[FILTER]
    Name         record_modifier
    Match        travel_app
    # Wrap the log line in a "message" JSON key so it matches the SRE Agent's API schema
    Record       message ${log}

[OUTPUT]
    Name         http
    Match        travel_app
    # Set this to the ngrok URL or your server's IP if the agent is remote
    # e.g., Host my-sre-agent.ngrok-free.app
    Host         127.0.0.1
    # Set to 80 or 443 if using ngrok (and change tls to On)
    Port         8000
    URI          /ingest
    Format       json
    # Uncomment the line below if you are forwarding to an https ngrok URL
    # tls        On
